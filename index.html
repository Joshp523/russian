<style>
*{box-sizing:border-box}html,body{margin:0}html{background:#b1aeaa}
body{font:17px/1.4 "Roboto Condensed",sans-serif;color:#1b1c1d;background:transparent;min-height:100vh}
/* concrete photo pinned behind the page; the html colour matches it so iPhone's bottom strip blends in */
body::before{content:"";position:fixed;inset:0;z-index:-1;background:url(concrete.jpg) center/cover no-repeat #b1aeaa;pointer-events:none}
@media (display-mode: standalone){html{min-height:calc(100% + env(safe-area-inset-top,0px))}}
main{max-width:520px;margin:0 auto;padding:0 0 110px}.o,h1,h3,.btn,nav button,.chip{font-family:Oswald,sans-serif;text-transform:uppercase;letter-spacing:.12em}
.b{background:#b30f27;color:#f3efe6;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;display:flex;justify-content:space-between;font-size:14px;border-bottom:4px solid #1b1c1d}
.k{background:#2b2c2e;color:#eeebe3;border:3px solid #1b1c1d;box-shadow:6px 6px 0 #1b1c1d;padding:14px;margin:16px}.k h3{margin:0 0 8px;font-size:15px;color:#e6b94f;font-weight:500}.m{color:#c4c3bc;font-size:14px}
.btn{display:block;width:100%;min-height:48px;border:3px solid #1b1c1d;background:#b30f27;color:#fff;font-size:16px;margin-top:12px;box-shadow:4px 4px 0 #1b1c1d}.btn.g{background:#3a4a3f}
.lnk{background:none;border:0;color:#c4c3bc;text-decoration:underline;font:14px "Roboto Condensed",sans-serif;margin-top:10px;padding:6px 0}
.big{font:600 44px Oswald,sans-serif;color:#fff}.t{height:12px;background:#4a4b4d;margin:4px 0 12px}.t i{display:block;height:100%;background:#d8213a}
.ru{font-size:22px;line-height:1.35}input{display:block;width:100%;min-height:54px;margin-top:10px;border:3px solid #1b1c1d;background:#e8e4da;font:24px "Roboto Condensed",sans-serif;padding:8px 12px;color:#1b1c1d}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#1b1c1d;border-top:4px solid #b30f27}nav button{flex:1;background:none;border:0;color:#c4c3bc;font-size:11px;letter-spacing:.06em;padding:14px 0 calc(22px + env(safe-area-inset-bottom,0px))}nav .on{background:#b30f27;color:#fff}
.ok{color:#6fd68c}.bad{color:#e6b94f}table{width:100%;border-collapse:collapse;font-size:16px}td{padding:5px 4px;border-top:1px solid #4a4b4d;vertical-align:top}
.src{color:#c4c3bc;font-size:14px;margin-top:4px}.q{border-left:4px solid #b30f27;padding:2px 0 2px 10px;margin:10px 0}.q .ru{font-size:18px}
u{text-decoration:none;border-bottom:2px solid #e6b94f}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.chip{border:2px solid #1b1c1d;background:#4a4b4d;color:#eeebe3;padding:8px 10px;font-size:12px}.chip.on{background:#b30f27;color:#fff}
details{border-top:1px solid #4a4b4d;padding:6px 0}summary{cursor:pointer;font-size:18px;list-style:none}summary::-webkit-details-marker{display:none}.gl{color:#c4c3bc;font-size:14px}
span.w{cursor:pointer;border-radius:2px}span.w:active,span.w.sel{background:#b30f27;color:#fff}

.x{float:right;background:none;border:0;color:#c4c3bc;font-size:22px;line-height:1;padding:0 4px}

</style></head><body><main id="app"></main><div id="sheet"></div><nav id="nav"></nav>
<script src="data.js"></script>
<script>
const IV=[0,1,3,7,16,35],K='rus1';
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=iso(new Date()),addD=n=>{const d=new Date();d.setDate(d.getDate()+n);return iso(d)};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>s.replace(/́/g,'').toLowerCase().replace(/ё/g,'е').trim();
const ac=s=>String(s||'').replace(/'/g,'́');
/* Урок 1 (original hand-written deck): id, tag, sentence, hint, answer (stressed), rule */
const L=[
['m1','идти','Сейчас я ___ в магазин.','идти / ходить','иду́','Один конкретный путь, прямо сейчас → идти́: я иду́, ты идёшь, они иду́т.'],
['m2','идти','Я каждый день ___ в университет пешком.','идти / ходить','хожу́','Привычка, повторение → ходи́ть: я хожу́, ты хо́дишь.'],
['m3','идти','Вчера мы ___ в кино. (пошли и вернулись)','идти / ходить','хо́дили','Туда и обратно в прошлом → ходи́ть (хо́дили).'],
['m4','идти','Куда ты ___?','идти / ходить','идёшь','Вопрос «куда?» прямо сейчас → идти́: идёшь.'],
['m5','идти','Когда я ___ домой, я встретил друга. (я = он)','идти / ходить','шёл','Прошедшее от идти́ нерегулярное: шёл, шла, шло, шли.'],
['m6','идти','Когда она ___ домой, пошёл дождь.','идти / ходить','шла','Прошедшее от идти́: шёл, шла, шло, шли.'],
['m7','ехать','Мы сейчас ___ на поезде в Брюгге.','ехать / ездить','е́дем','Один путь, сейчас → е́хать: е́ду, е́дешь, е́дем.'],
['m8','ехать','Он часто ___ в Москву по делам.','ехать / ездить','е́здит','Регулярно → е́здить: е́зжу, е́здишь, е́здит.'],
['m9','вести','Она каждое утро ___ ребёнка в школу.','вести / водить','во́дит','Регулярно → води́ть: вожу́, во́дишь. (Один путь: вести́ — веду́, ведёшь.)'],
['m10','нести','Я сейчас ___ сумку домой.','нести / носить','несу́','Один путь, сейчас → нести́: несу́, несёшь.'],
['m11','нести','Он всегда ___ с собой словарь.','нести / носить','но́сит','Всегда, обычно → носи́ть: ношу́, но́сишь.'],
['m12','лететь','Смотри, самолёт ___ над городом!','лететь / летать','лети́т','Один полёт, сейчас → лете́ть: лечу́, лети́шь, лети́т.'],
['m13','лететь','Я боюсь ___ на самолёте.','лететь / летать','лета́ть','Общий факт, без одного маршрута → лета́ть.'],
['m14','бежать','Смотри, мальчик ___ по улице!','бежать / бегать','бежи́т','Один путь, сейчас → бежа́ть: бегу́, бежи́шь, бежи́т.'],
['m15','бежать','Я люблю ___ утром в парке.','бежать / бегать','бе́гать','Любить + процесс вообще → бе́гать.'],
['m16','плыть','Смотри, кто-то ___ по реке.','плыть / плавать','плывёт','Один путь, сейчас → плыть: плыву́, плывёшь, плывёт.'],
['m17','плыть','Он хорошо ___.','плыть / плавать','пла́вает','Умение, способность → пла́вать.'],
['p1','приставки','Вчера он ___ из дома в восемь утра.','выйти / выходить','вы́шел','Один раз, результат → совершенный вид: вы́йти (вы́йду, вы́шел) + из + род. п.'],
['p2','приставки','Он обычно ___ из дома в восемь.','выйти / выходить','выхо́дит','Обычно → несовершенный вид: выходи́ть (выхожу́, выхо́дишь).'],
['p3','приставки','Завтра я ___ к тебе в гости.','прийти / приходить','приду́','Один раз в будущем → прийти́: приду́, придёшь, придёт. к + дат. п.'],
['p4','приставки','Каждый день она ___ домой в шесть.','прийти / приходить','прихо́дит','Каждый день → приходи́ть: прихожу́, прихо́дишь.']];
/* V[verb] = [kind u|m|p, base group, aspect p|i, OpenRussian partner, OpenRussian English gloss, prefix, forms[13], pair label] */
const TL=['инфинитив','повел., ты','повел., вы','прош., он','прош., она','прош., оно','прош., они','я','ты','он / она','мы','вы','они'];
const PM={'в':'внутрь','вы':'наружу','при':'прибытие','у':'уход','под':'приближение','от':'удаление','пере':'через','про':'мимо, сквозь','до':'до цели','за':'по пути, за чем-то','об':'вокруг','с':'вниз, с','по':'начало движения','раз':'в разные стороны'};
const LM=Object.fromEntries(L.map(c=>[c[0],c]));const CM=Object.fromEntries(C.map(c=>[c[0],c]));
const src=i=>{const w=W[i];return`${w[0]}, «${w[1]}», ${w[2]}`};
function card(id){const l=LM[id];if(l)return{id,deck:'l1',tag:l[1],sent:l[2],hint:l[3],ans:l[4],rule:l[5]};
 const c=CM[id];if(!c)return null;const v=V[c[1]],k=v[0],tag=k==='p'?v[5]+'-':v[1],inf=ac(v[6][0]);
 const rule=k==='u'?`${inf} — однонаправленный: одно движение в одну сторону (сейчас, конкретный путь, фон в прошлом).`
  :k==='m'?`${inf} — разнонаправленный: повторение, привычка, туда и обратно, без направления, умение.`
  :v[5]==='по'&&v[2]==='p'?`${inf}: по- + однонаправленный → совершенный вид, начало движения («отправиться»).`
  :v[2]==='p'?`${inf}: ${v[5]}- (${PM[v[5]]||'приставка'}) + однонаправленный → совершенный вид: одно законченное действие, результат.`
  :`${inf}: ${v[5]}- (${PM[v[5]]||'приставка'}) + разнонаправленный → несовершенный вид: процесс, повторение, привычка.`;
 return{id,deck:k==='p'?'pref':'base',tag,verb:c[1],ti:c[2],sent:c[3],hint:v[7]+' · '+TL[c[2]],ans:c[4],rule,src:c[5],gloss:v[4]}}
function alts(c){if(!c.verb)return[];const v=V[c.verb],o=[];v[7].split(' / ').forEach(x=>{x=x.trim();if(x!==c.verb&&V[x])o.push(V[x][6][c.ti])});
 return o.flatMap(f=>String(f||'').split(/[,;]/)).map(f=>norm(f.replace(/'/g,''))).filter(Boolean)}
let S={cards:{},tg:{},log:[],days:{},sus:{},set:{n:10,d:{l1:1,base:1,pref:1}}};
try{const o=JSON.parse(localStorage.getItem(K));if(o)S={...S,...o,set:{...S.set,...(o.set||{}),d:{...S.set.d,...((o.set||{}).d||{})}}}}catch(e){}
let tab='home',Q=[],TOT=0,tries=0,fb=null,msg='',dq='';
const persist=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
let pt;const save=()=>{persist();if(AU){clearTimeout(pt);pt=setTimeout(sync,4000)}};
const streak=()=>{let n=0,i=S.days[today]?0:1;while(S.days[addD(-i)]){n++;i++}return n};
const ALLIDS=L.map(c=>c[0]).concat(C.map(c=>c[0]));
const live=id=>{const c=card(id);return c&&!S.sus[id]&&S.set.d[c.deck]};
function queue(){const ids=ALLIDS.filter(live),due=ids.filter(i=>S.cards[i]&&S.cards[i].due<=today),fresh=ids.filter(i=>!S.cards[i]),used=Object.values(S.cards).filter(c=>c.f===today).length;
 return due.concat(fresh.slice(0,Math.max(0,S.set.n-used)))}
function start(){Q=queue();TOT=Q.length;tries=0;fb=null;msg='';tab='drill';render()}
function check(){const v=document.getElementById('a').value;if(!v.trim())return;const c=card(Q[0]);
 if(norm(v)===norm(c.ans)){grade(c,tries?1:2,v)}
 else if(alts(c).includes(norm(v))){msg='Форма верная, но у автора другой глагол пары. Подумайте, почему.';render()}
 else if(!tries){tries=1;msg='Не совсем. Попробуйте ещё раз.';render()}
 else{S.log.push({t:Date.now(),id:c.id,a:v});S.log=S.log.slice(-200);grade(c,0,v)}}
function grade(c,g,v){const id=c.id,s=S.cards[id]||{b:0,f:today};
 if(!tries){const t=S.tg[c.tag]||[0,0];t[1]++;if(g===2)t[0]++;S.tg[c.tag]=t}
 s.b=g===2?Math.min(5,s.b+1):g===1?Math.max(1,s.b):0;s.due=addD(IV[s.b]);s.t=Date.now();S.cards[id]=s;S.days[today]=(S.days[today]||0)+1;
 if(g===0)Q.push(id);fb={g};msg='';save();render()}
function next(){Q.shift();tries=0;fb=null;msg='';render()}
function suspend(){S.sus[Q[0]]=Date.now();Q=Q.filter(i=>i!==Q[0]);tries=0;fb=null;msg='';save();render()}
const st=a=>a.replace(/([аеёиоуыэюяАЕЁИОУЫЭЮЯ])́/g,'<b style="color:#e6b94f">$1́</b>');
const hl=(s,w)=>{const e=esc(s),i=e.indexOf(w);return i<0?e:e.slice(0,i)+'<u>'+e.slice(i,i+w.length)+'</u>'+e.slice(i+w.length)};
const tw=h=>h.replace(/[А-Яа-яЁё\u0301]+(?:-[А-Яа-яЁё\u0301]+)*/g,m=>`<span class="w">${m}</span>`);
const quote=q=>`<div class="q"><div class="ru">«${tw(hl(q[0],q[2]))}»</div><div class="src">${esc(src(q[1]))}</div></div>`;
const setN=n=>{S.set.n=n;save();render()};const tgl=d=>{S.set.d[d]=S.set.d[d]?0:1;save();render()};
function home(){const q=queue(),due=q.filter(i=>S.cards[i]).length,tg=Object.entries(S.tg).filter(([k,v])=>v[1]>=3).map(([k,v])=>[k,v[0]/v[1]]).sort((a,b)=>a[1]-b[1]).slice(0,4);
 const seen=Object.keys(S.cards).length,tot=ALLIDS.length;
 return`<div class="b o"><span>★ Глаголы</span><span>Серия ${streak()}</span></div><div class="k"><h3>Норма сегодня</h3><div style="display:flex;gap:28px"><div><div class="big">${due}</div><div class="m">повторений</div></div><div><div class="big">${q.length-due}</div><div class="m">новых</div></div></div><button class="btn" onclick="start()">${q.length?'Начать смену ★':'Норма выполнена'}</button><div class="m" style="margin-top:10px">Изучено ${seen} из ${tot} карточек</div><div class="t"><i style="width:${seen/tot*100}%"></i></div></div>
 <div class="k"><h3>Слабые места</h3>${tg.length?tg.map(([k,v])=>`<div class="m">${esc(k)} ${Math.round(v*100)}%</div><div class="t"><i style="width:${v*100}%"></i></div>`).join(''):'<div class="m">Данные появятся после первых смен.</div>'}</div>
 <div class="k"><h3>Настройки</h3><div class="m">Новых карточек в день</div><div class="chips">${[5,10,15,25].map(n=>`<button class="chip ${S.set.n===n?'on':''}" onclick="setN(${n})">${n}</button>`).join('')}</div>
 <div class="m" style="margin-top:12px">Колоды</div><div class="chips">${[['l1','Урок 1'],['base','Без приставок'],['pref','С приставками']].map(([d,l])=>`<button class="chip ${S.set.d[d]?'on':''}" onclick="tgl('${d}')">${l}</button>`).join('')}</div>
 <div class="m" style="margin-top:10px">${C.length} карточек из русской классики · ${Object.keys(V).length} глаголов в словаре</div></div>`}
function drill(){if(!Q.length)return`<div class="b o"><span>★ Смена окончена</span></div><div class="k"><h3>Готово</h3><div class="m">Сделано ${TOT} карточек. Возвращайтесь завтра.</div><button class="btn" onclick="tab='home';render()">На главную</button></div>`;
 const c=card(Q[0]);
 const full=tw(esc(c.sent)).replace('___','<u><span class="w">'+st(c.ans)+'</span></u>');
 const body=fb?`<div class="k"><h3 class="${fb.g?'ok':'bad'}">${fb.g===2?'Верно':fb.g===1?'Верно со второго раза':'Неверно'}</h3><div class="ru">${full}</div>${c.src!=null?`<div class="src">— ${esc(src(c.src))}</div>`:''}<div style="margin-top:10px">${st(esc(c.rule))}</div>${c.gloss?`<div class="gl" style="margin-top:6px">OpenRussian: “${esc(c.gloss)}”</div>`:''}<button class="btn" onclick="next()">Дальше</button>${c.src!=null?'<button class="lnk" onclick="suspend()">Убрать эту карточку</button>':''}</div>`
 :`<div class="k"><h3>${esc(c.hint)}</h3><div class="ru">${tw(esc(c.sent)).replace('___','<b style="color:#e6b94f">___</b>')}</div>${c.src!=null?`<div class="src">— ${esc(src(c.src))}</div>`:''}<input id="a" autocapitalize="off" autocorrect="off" spellcheck="false" lang="ru" autocomplete="off" aria-label="Ответ" onkeydown="if(event.key==='Enter')check()"><div class="bad" style="margin-top:6px">${esc(msg)}</div><div class="m">Ударение не нужно · е = ё · нажмите на слово — перевод</div><button class="btn" onclick="check()">Проверить</button></div>`;
 return`<div class="b o"><span>★ Упражнение</span><span>Осталось ${Q.length}</span></div>${body}`}
function rules(){return`<div class="b o"><span>★ Правила</span><span>${R.length} тем</span></div>`+R.map(r=>`<div class="k"><h3>${esc(r.h)}</h3>${(r.p||[]).map(p=>`<div style="margin-bottom:6px">${st(esc(p))}</div>`).join('')}
 ${r.pairs?`<table>${B.map(b=>`<tr><td>${st(ac(V[b[0]][6][0]))} / ${st(ac(V[b[1]][6][0]))}</td><td class="m">${esc(b[2])}<br>“${esc(V[b[0]][4])}”</td></tr>`).join('')}</table>`:''}
 ${r.pref?r.pref.map(p=>`<h4>${esc(p[0])} · ${esc(p[1])} · ${esc(p[2])}</h4>${quote(p[3])}`).join(''):''}
 ${(r.ex||[]).map(quote).join('')}</div>`).join('')
 +`<div class="k" style="border-color:#b30f27"><h3>Из книги</h3>${quote(FIRST)}</div>`
 +`<div class="k"><h3>Источники и лицензии</h3><div class="m" style="margin-bottom:8px">Все примеры — дословные цитаты (изменены только тире). Ударения и английские значения — из словаря OpenRussian. Объяснения правил — краткие, от составителя.</div>
 <div class="m">• Формы глаголов, ударения, видовые пары, переводы: <a style="color:#e6b94f" href="https://github.com/Badestrand/russian-dictionary">OpenRussian dictionary data</a> (openrussian.org), CC BY-SA 4.0.</div>
 <div class="m">• Тексты: <a style="color:#e6b94f" href="https://github.com/nevmenandr/word2vec-russian-novels">nevmenandr/word2vec-russian-novels</a> (Б. Орехов); произведения в общественном достоянии:</div>
 <div class="m" style="margin-top:6px">${W.map(w=>`${esc(w[0])}, «${esc(w[1])}» (${w[2]}) — ${C.filter(c=>W[c[5]]===w).length} карт.`).join('<br>')}</div></div>`}
function vtable(v){const m=V[v],f=m[6].map(ac),c=C.filter(x=>x[1]===v).length;
 return`<div class="gl">${m[2]==='p'?'сов.':'несов.'}${m[3]&&m[3]!=='-'?' · пара: '+esc(m[3].replace(/[,;]/g,', ')):''} · ${c} карт.</div><div class="gl">OpenRussian: “${esc(m[4])}”</div>
 <table><tr><td class="m">я</td><td>${st(f[7])}</td><td class="m">мы</td><td>${st(f[10])}</td></tr><tr><td class="m">ты</td><td>${st(f[8])}</td><td class="m">вы</td><td>${st(f[11])}</td></tr><tr><td class="m">он</td><td>${st(f[9])}</td><td class="m">они</td><td>${st(f[12])}</td></tr>
 <tr><td class="m">прош.</td><td colspan="3">${[3,4,5,6].map(i=>st(f[i])).join(', ')}</td></tr><tr><td class="m">повел.</td><td colspan="3">${st(f[1])}, ${st(f[2])}</td></tr></table>`}
function dict(){
 return`<div class="b o"><span>★ Словарь</span><span>${Object.keys(V).length} глаголов</span></div><div class="k"><h3>Поиск</h3><input id="dq" value="${esc(dq)}" placeholder="прийти, carry…" autocapitalize="off" autocomplete="off" oninput="dq=this.value;document.getElementById('dl').innerHTML=dlist()"><div class="m" style="margin-top:6px">Данные: OpenRussian, CC BY-SA 4.0</div></div><div id="dl">${dlist()}</div>`}
function dlist(){const q=norm(dq);return B.map(b=>{const vs=Object.keys(V).filter(v=>V[v][1]===b[0]&&(!q||norm(v).includes(q)||V[v][4].toLowerCase().includes(q))).sort((a,c)=>(V[a][0]>V[c][0])-(V[a][0]<V[c][0])||(V[a][7]>V[c][7])-(V[a][7]<V[c][7])||(V[a][2]>V[c][2])-(V[a][2]<V[c][2]));
 return vs.length?`<div class="k"><h3>${esc(b[0])} / ${esc(b[1])}</h3>${vs.map(v=>`<details ontoggle="if(this.open&&!this.dataset.f){this.insertAdjacentHTML('beforeend',vtable('${v}'));this.dataset.f=1}"><summary>${st(ac(V[v][6][0]))} <span class="gl">${V[v][2]==='p'?'сов.':'несов.'} · ${esc(V[v][4].split(',').slice(0,3).join(','))}</span></summary></details>`).join('')}</div>`:''}).join('')||'<div class="k"><div class="m">Ничего не найдено.</div></div>'}
function stats(){const bx=[0,1,2,3,4,5].map(i=>Object.values(S.cards).filter(c=>c.b===i).length),mx=Math.max(1,...bx),ns=Object.keys(S.sus).length;
 return`<div class="b o"><span>★ Итоги</span><span>Серия ${streak()}</span></div><div class="k"><h3>Коробки (0 · 1д · 3д · 7д · 16д · 35д)</h3><div style="display:flex;gap:6px;align-items:flex-end;height:90px">${bx.map(v=>`<div style="flex:1;background:#b30f27;height:${v/mx*90+3}px" title="${v}"></div>`).join('')}</div><div class="m" style="display:flex;justify-content:space-around;margin-top:4px">${bx.map(v=>`<span>${v}</span>`).join('')}</div></div>
 <div class="k"><h3>Ошибки (последние)</h3>${S.log.slice(-8).reverse().map(x=>{const c=card(x.id);return c?`<div class="m">${esc(x.a)} → <span class="ok">${st(c.ans)}</span> · ${esc(c.hint)}</div>`:''}).join('')||'<div class="m">Пока пусто.</div>'}</div>
 ${ns?`<div class="k"><h3>Убранные карточки</h3><div class="m">${ns} шт.</div><button class="btn g" onclick="S.sus={};save();render()">Вернуть все</button></div>`:''}${cloud()}`}
/* Tap-to-translate: lex.js (OpenRussian glosses) loads on first tap */
let lexP=null;const lex=()=>lexP||(lexP=new Promise((ok,no)=>{const sc=document.createElement('script');sc.src='lex.js';sc.onload=ok;sc.onerror=()=>{lexP=null;no()};document.head.appendChild(sc)}));
let selW=null;const closeW=()=>{document.getElementById('sheet').style.display='none';if(selW)selW.classList.remove('sel');selW=null};
async function showW(el){if(selW)selW.classList.remove('sel');selW=el;el.classList.add('sel');const raw=el.textContent.replace(/\u0301/g,''),k=norm(raw),sh=document.getElementById('sheet');
 sh.innerHTML='<div class="k"><div class="m">…</div></div>';sh.style.display='block';
 let E=[];try{await lex();E=LEX[k]||[]}catch(e){}
 const wl=w=>'https://en.wiktionary.org/wiki/'+encodeURIComponent(w.replace(/\u0301/g,'').toLowerCase());
 sh.innerHTML=`<div class="k"><button class="x" onclick="closeW()" aria-label="Закрыть">×</button><h3>${esc(raw)}</h3>${E.length?E.map(e=>`<div style="margin-top:8px"><b>${st(esc(e[0]))}</b> <span class="gl">${esc(e[1])}</span><div>${esc(e[2])}</div></div>`).join(''):'<div class="m">Нет в словаре OpenRussian (часто это причастие, деепричастие или имя).</div>'}
 <div class="m" style="margin-top:10px"><a style="color:#e6b94f" target="_blank" rel="noopener" href="${wl(E[0]?E[0][0]:raw)}">Wiktionary →</a> · OpenRussian, CC BY-SA 4.0</div></div>`}
document.addEventListener('click',e=>{const w=e.target.closest('span.w');if(w){showW(w);return}if(!e.target.closest('#sheet'))closeW()});
